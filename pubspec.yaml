name: quizai
description: "QuizAI - Educational AI Quiz App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  firebase_core: ^4.10.0
  cloud_firestore: ^6.9.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^5.2.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
